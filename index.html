<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="STUDENTS STUDY HUB: practice questions, notes, past papers and study groups for SS1 to SS3 students.">
  <title>STUDENTS STUDY HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&family=Noto+Sans+Math&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar"></header>
  <main id="app"><p class="muted center">Loading…</p></main>

  <!-- Script order matters. Each line only needs the ones above it. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <!-- 1. Subjects, topics and the addQ() helper -->
  <script src="data.js"></script>

  <!-- 2. Written questions (they call addQ, so they come after data.js) -->
  <script src="questions-old.js"></script>
  <script src="questions-new1.js"></script>
  <script src="questions-new2.js"></script>

  <!-- 3. WAEC past papers (also adds the WAEC objectives to the question bank) -->
  <script src="pastpapers.js"></script>

  <!-- 4. Computed practice questions (gen.js first, gen2.js needs it) -->
  <script src="gen.js"></script>
  <script src="gen2.js"></script>

  <!-- 5. Quiz and past-papers screens -->
  <script src="quiz.js"></script>

  <!-- 6. The app itself, last, because it starts running as soon as it loads -->
  <script src="app.js"></script>
</body>
</html>
